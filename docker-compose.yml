services:
  postgres:
    image: postgres:16-alpine
    container_name: taskify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskify
      POSTGRES_PASSWORD: taskify_dev_password
      POSTGRES_DB: taskify
    ports:
      - "5432:5432"
    volumes:
      - taskify_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskify -d taskify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskify_pg_data:
